# Checks run on every `git commit` once you've run `pre-commit install`, and by
# CI on every file (.github/workflows/ci.yml), so the two always agree.
# Quick ones only: the tests run in CI. Update the versions with
# `pre-commit autoupdate`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      # Lint first: its fixes (such as sorting imports) can change the layout,
      # which the formatter then tidies.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
