[project]
name = "wren"
version = "0.8.0"
description = "A small, readable coding-agent harness for the terminal, built to be learned from."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    # The OpenAI provider. Imported only when that provider is chosen.
    "openai>=2",
    # Tool inputs are Pydantic models. The anthropic SDK already depends on
    # Pydantic, but we import it ourselves, so we say so.
    "pydantic>=2",
    # Signing in with ChatGPT (auth/chatgpt.py): checks the ID token's
    # signature against OpenAI's published keys. `[crypto]` brings in the
    # `cryptography` package, which does the RSA maths.
    "pyjwt[crypto]>=2.15.1",
    # The full-screen terminal interface (tui.py). Brings in Rich, which
    # renders the markdown and coloured text.
    "textual>=8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # Runs the lint and format checks in .pre-commit-config.yaml (which pins
    # their versions), on commit and in CI.
    "pre-commit>=4",
]

# `pip install -e .` puts a `wren` command on your PATH that calls wren.cli:main
[project.scripts]
wren = "wren.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wren"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"  # lets a test be `async def`: needed to drive the Textual app
pythonpath = ["src"]

# Ruff lints and formats. Its version is pinned in .pre-commit-config.yaml;
# run it with `pre-commit run --all-files`. The Python version it targets
# comes from requires-python above.
[tool.ruff]
# The docs' code snippets are laid out by hand for reading, and record each
# step as it was: leave them alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Ruff's default rules, plus bugbear (likely bugs) and bandit (security).
extend-select = ["B", "S"]

[tool.ruff.lint.per-file-ignores]
# Bandit's rules are for the code Wren runs. Tests and the logo generator
# assert, run commands and use fixed paths on purpose.
"tests/**" = ["S"]
"docs/**" = ["S"]
