[project]
name = "wren"
version = "0.2.0"
description = "A small, readable coding-agent harness for the terminal, built to be learned from."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# `pip install -e .` puts a `wren` command on your PATH that calls wren.cli:main
[project.scripts]
wren = "wren.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wren"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
